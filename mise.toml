[tools]
bun = "1.3"
node = "22"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.build]
description = "emit themes for every terminal ttheme wires into dist/"
run = "bun src/bin.ts build"

[tasks.test]
description = "unit tests, including the contrast gate"
run = "bun test"

[tasks.check]
description = "typecheck"
run = "tsc --noEmit"

[tasks.lint]
description = "biome lint + format check + import order"
run = "biome check ."

[tasks.format]
description = "apply biome fixes"
run = "biome check --write ."

[tasks.slop]
description = "oxlint with the vendored anti-slop rules"
run = "oxlint"

[tasks."shell:check"]
description = "syntax-check and exercise the zsh layer"
depends = ["build"]
run = '''
set -e
for f in shell/*.zsh shell/adapters/*.zsh; do
  zsh -n "$f"
done
zsh shell/check.zsh
zsh tests/latency.zsh check
zsh tests/latency.zsh forks
'''

[tasks.forks]
description = "the fork ratchet: processes a shell with ttheme starts beyond a bare zsh, per journey and terminal, against tests/forks.tsv — `mise run forks [--update]`"
depends = ["build"]
run = "zsh tests/latency.zsh forks"

[tasks."ghostty:check"]
description = "validate emitted ghostty files with ghostty +validate-config"
depends = ["build"]
run = '''
set -e
if ! command -v ghostty >/dev/null 2>&1; then
  echo "ghostty:check skipped — no ghostty binary on this machine"
  exit 0
fi
for f in dist/ghostty/themes/*; do
  ghostty +validate-config --config-file="$PWD/$f" ||
    { echo "ghostty:check failed: $f"; exit 1; }
done
echo "ghostty:check ok"
'''

[tasks."bin:build"]
description = "bundle the node cli into bin/ttheme.js"
depends = ["build"]
run = '''
bun build src/bin.ts --target=node --minify --sourcemap=linked --outdir=bin --entry-naming=ttheme.js
printf '{"type":"module"}\n' > bin/package.json
bun -e 'const f = "bin/ttheme.js.map"; const m = await Bun.file(f).json(); delete m.sourcesContent; await Bun.write(f, JSON.stringify(m))'
'''

[tasks."bin:check"]
description = "smoke-test the node bundle: help, non-interactive init from the packed tarball, the installed CLI copy, keep surviving an add and an upgrade, idempotency, uninstall"
depends = ["build", "bin:build"]
run = '''
{% raw %}
set -e
if ! command -v node >/dev/null 2>&1; then
  echo "bin:check skipped — no node binary on this machine"
  exit 0
fi
head -1 bin/ttheme.js | grep -q '^#!/usr/bin/env node' ||
  { echo "bin:check failed: shebang missing"; exit 1; }
node bin/ttheme.js --help > /dev/null
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
cat > "$tmp/worker.cjs" <<'JS'
const { Worker } = require('node:worker_threads')
const { resolve } = require('node:path')
const worker = new Worker(resolve(process.argv[2]))
worker.on('message', (answer) => process.exit(typeof answer.error === 'string' ? 0 : 1))
worker.on('error', () => process.exit(1))
worker.on('exit', () => process.exit(1))
worker.postMessage({ id: 1, job: 'thumb', from: '/nonexistent.png', to: '/dev/null', width: 8, height: 8 })
setTimeout(() => process.exit(1), 10000)
JS
node "$tmp/worker.cjs" bin/ttheme.js ||
  { echo "bin:check failed: the bundle does not serve renders as a worker"; exit 1; }
sandboxed() {
  env -i PATH="$PATH" HOME="$tmp" XDG_CONFIG_HOME="$tmp/.config" ZDOTDIR="$tmp" TTHEME_NAMES=off TTHEME_AUTO_UPDATE=off "$@"
}
cli() {
  sandboxed node "$tmp/.config/ttheme/ttheme.js" "$@" > /dev/null
}
layer() {
  sandboxed zsh -c 'source "$HOME/.config/ttheme/ttheme.zsh"; __tt_reload_ghostty() { :; }; '"$1"
}
tar -xzf "$tmp/$(npm pack --pack-destination "$tmp" --silent)" -C "$tmp"
printf '{"type":"commonjs"}\n' > "$tmp/package.json"
run_init() {
  sandboxed GHOSTTY_RESOURCES_DIR=x node "$tmp/package/bin/ttheme.js" init --yes < /dev/null > /dev/null
}
run_init
for f in ttheme/ttheme.js ttheme/package.json ttheme/ttheme.zsh ttheme/preview.zsh ttheme/palettes.zsh ttheme/config.zsh ttheme/adapters/_osc.zsh ttheme/ghostty.conf ghostty/config; do
  [ -e "$tmp/.config/$f" ] || { echo "bin:check failed: missing $f"; exit 1; }
done
layer '(( ${#TTHEME_PALETTE} == 0 ))' ||
  { echo "bin:check failed: a fresh init should install no palettes"; exit 1; }
grep -q '^theme = ' "$tmp/.config/ttheme/ghostty.conf" &&
  { echo "bin:check failed: a fresh init should not pin a terminal theme"; exit 1; }
cli add gojo
layer '(( ${#TTHEME_PALETTE} == 1 )) && [[ -n ${TTHEME_PALETTE[gojo]} ]]' ||
  { echo "bin:check failed: add did not reach the installed layer"; exit 1; }
grep -q '^theme = ttheme-gojo$' "$tmp/.config/ttheme/ghostty.conf" ||
  { echo "bin:check failed: add did not point ghostty at the palette"; exit 1; }
cli add geto
layer '__tt_keep geto > /dev/null' ||
  { echo "bin:check failed: keep could not save a default"; exit 1; }
cli add sukuna
grep -q '^theme = ttheme-geto$' "$tmp/.config/ttheme/ghostty.conf" ||
  { echo "bin:check failed: an add undid the default keep saved"; exit 1; }
run_init
layer '(( ${#TTHEME_PALETTE} == 3 ))' ||
  { echo "bin:check failed: init --yes over an install dropped its palettes"; exit 1; }
grep -q '^theme = ttheme-geto$' "$tmp/.config/ttheme/ghostty.conf" ||
  { echo "bin:check failed: init --yes over an install lost its default"; exit 1; }
cli remove gojo geto sukuna
layer '(( ${#TTHEME_PALETTE} == 0 ))' ||
  { echo "bin:check failed: remove did not reach the installed layer"; exit 1; }
run_init
for f in "$tmp/.config/ghostty/config" "$tmp/.zshrc"; do
  [ "$(grep -c '# ttheme begin' "$f")" = 1 ] ||
    { echo "bin:check failed: init is not idempotent in $f"; exit 1; }
done
sandboxed node "$tmp/package/bin/ttheme.js" uninstall < /dev/null > /dev/null 2>&1 &&
  { echo "bin:check failed: uninstall ran without a terminal or --yes"; exit 1; }
sandboxed node "$tmp/package/bin/ttheme.js" uninstall --yes < /dev/null > /dev/null
for f in "$tmp/.config/ttheme" "$tmp/.config/ghostty/config" "$tmp/.zshrc"; do
  [ -e "$f" ] && { echo "bin:check failed: uninstall left $f behind"; exit 1; }
done
echo "bin:check ok"
{% endraw %}
'''

[tasks.tui]
description = "compare every TUI screen against tests/screens/, or only the scenarios named — `mise run tui theme-edit 'browse-*'`"
depends = ["build", "bin:build"]
run = "zsh tests/tui.zsh"

[tasks."tui:update"]
description = "rewrite tests/screens/ from what the TUIs draw now, every screen or only the scenarios named"
depends = ["build", "bin:build"]
run = "zsh tests/tui.zsh --update"

[tasks.look]
description = "draw one TUI screen as the terminal shows it, colors on, into a PNG and a text grid with row and column numbers for Claude to read — a tests/tui.zsh scenario or a screen, a size, then keys: `mise run look preview-open 120x34`, `mise run look edit:kita 130x38 down down enter`, `--emit styles --rows 3-9` for each run's SGR"
quiet = true
run = ["mise run -q bin:build > /dev/null", "zsh tests/tui.zsh look"]

[tasks.demo]
description = "open one TUI scenario for real, in its fixture — `mise run demo browse-filter`"
depends = ["build", "bin:build"]
interactive = true
run = "zsh tests/tui.zsh demo"

[tasks.sandbox]
description = "a throwaway home wired with this checkout and every palette, in its own Ghostty or another terminal — `mise run sandbox [--here | --iterm | --wezterm | --kitty | --alacritty | --warp | --terminal-app | --konsole] [--empty | --mine | palette…]`"
depends = ["build", "bin:build"]
interactive = true
run = "zsh tests/sandbox.zsh"

[tasks.bench]
description = "shell latency with and without ttheme, zsh-bench's four metrics against its thresholds, and with --against the working tree's layer against a commit's — `mise run bench [--against <ref>] [runs]`"
depends = ["build"]
run = "zsh tests/latency.zsh bench"

[tasks.parity]
description = "walk every journey in a model of each terminal, hold every terminal, Ghostty included, to the spec journeys.ts states, and the misses to tests/parity/facts.tsv and gaps.tsv — `mise run parity [--update] [--only <terminal,…>] [--journey <id,…>] [--show <journey.label>] [-v]`"
depends = ["build", "bin:build"]
wait_for = ["lint", "check", "test", "shell:check", "ghostty:check", "bin:check", "tui"]
run = "bun tests/parity/run.ts"

[tasks.compat]
description = "run the terminal compatibility cases in each installed terminal and compare them with tests/compat/expect.tsv — `mise run compat [--update] [ghostty iterm2 wezterm kitty alacritty warp terminal-app konsole…]`"
depends = ["build", "bin:build"]
run = "zsh tests/compat.zsh"

[tasks."compat:konsole"]
description = "run the compat cases in Konsole from a container (Ubuntu 24.04, Konsole 23.08 on Xvfb) — `mise run compat:konsole [--update]`"
depends = ["build", "bin:build"]
run = "docker build -q -t ttheme-konsole -f tests/compat/konsole.Dockerfile tests/compat > /dev/null && docker run --rm -v \"$PWD\":/work ttheme-konsole zsh tests/compat.zsh"

[tasks."site:dev"]
description = "the showcase site on http://localhost:3000 (PORT moves it), rebuilt and reloaded on every change"
dir = "{{config_root}}/site"
depends = ["build"]
run = "bun install && bun --watch dev.ts"

[tasks."site:build"]
description = "build the showcase site's assets into site/public as Vercel does, then typecheck its server and browser code and scan it for XSS"
dir = "{{config_root}}/site"
depends = ["build"]
run = "bun install --frozen-lockfile && bun build.ts && ./node_modules/.bin/tsc --noEmit -p . && ./node_modules/.bin/tsc --noEmit -p client && ./node_modules/.bin/xss-scan && ./node_modules/.bin/xss-scan --cwd client -p tsconfig.json"

[tasks.pages]
description = "gather what GitHub Pages serves into pages/: dist/manifest.json in the schema 1 shape installs from before the official palettes shipped with ttheme still fetch as their catalog, the README's pictures, and marketplaces.json, the list of every marketplace with the ttheme-marketplace topic that Browse's search reads (GITHUB_TOKEN when set)"
depends = ["build"]
run = "rm -rf pages && bun src/pages.ts pages && bun site/readme.ts pages"

[tasks.release]
description = "verify everything, then bump the version, tag it and push — the release workflow publishes it on npm and cuts the GitHub release — `mise run release 1.0.0`"
depends = ["ci"]
usage = 'arg "<version>" help="x.y.z, or patch | minor | major"'
run = '''
set -e
npm version "${usage_version}" -m "Bump version to %s"
git push --atomic --follow-tags origin main
tag="v$(jq -r .version package.json)"
run=
for _ in $(seq 30); do
  run=$(gh run list --workflow release.yml --branch "$tag" --json databaseId --jq '.[0].databaseId // empty')
  [ -n "$run" ] && break
  sleep 2
done
[ -n "$run" ] || { echo "release: no workflow run for $tag"; exit 1; }
gh run watch "$run" --compact --exit-status
echo "$tag is on npm — https://www.npmjs.com/package/@kecan0406/ttheme"
'''

[tasks.ci]
description = "everything the ci workflow runs"
depends = ["lint", "check", "test", "shell:check", "ghostty:check", "bin:check", "tui", "parity"]
