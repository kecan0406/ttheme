[tools]
bun = "1.3"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.build]
description = "emit themes for all five terminals into dist/"
run = "bun src/bin.ts build"

[tasks.test]
description = "unit tests, including the contrast gate"
run = "bun test"

[tasks.check]
description = "typecheck"
run = "tsc --noEmit"

[tasks.lint]
description = "biome lint + format check + import order"
run = "biome check ."

[tasks.format]
description = "apply biome fixes"
run = "biome check --write ."

[tasks."shell:check"]
description = "syntax-check and exercise the zsh layer"
depends = ["build"]
run = '''
set -e
for f in shell/*.zsh shell/adapters/*.zsh; do
  zsh -n "$f"
done
zsh shell/check.zsh
'''

[tasks."ghostty:check"]
description = "validate emitted ghostty files with ghostty +validate-config"
depends = ["build"]
run = '''
set -e
if ! command -v ghostty >/dev/null 2>&1; then
  echo "ghostty:check skipped — no ghostty binary on this machine"
  exit 0
fi
for f in dist/ghostty/themes/* dist/ghostty/ttheme.conf; do
  ghostty +validate-config --config-file="$PWD/$f" ||
    { echo "ghostty:check failed: $f"; exit 1; }
done
echo "ghostty:check ok"
'''

[tasks."bin:build"]
description = "bundle the node cli into bin/ttheme.js"
run = "bun build src/bin.ts --target=node --outfile=bin/ttheme.js"

[tasks."bin:check"]
description = "smoke-test the node bundle: help, non-interactive init, idempotency, installed layout"
depends = ["build", "bin:build"]
run = '''
{% raw %}
set -e
if ! command -v node >/dev/null 2>&1; then
  echo "bin:check skipped — no node binary on this machine"
  exit 0
fi
head -1 bin/ttheme.js | grep -q '^#!/usr/bin/env node' ||
  { echo "bin:check failed: shebang missing"; exit 1; }
node bin/ttheme.js --help > /dev/null
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
run_init() {
  env -i PATH="$PATH" HOME="$tmp" XDG_CONFIG_HOME="$tmp/.config" ZDOTDIR="$tmp" GHOSTTY_RESOURCES_DIR=x \
    node bin/ttheme.js init --yes < /dev/null > /dev/null
}
run_init
for f in ttheme/ttheme.zsh ttheme/palettes.zsh ttheme/ttheme.conf ttheme/config.zsh ttheme/adapters/_osc.zsh ghostty/config; do
  [ -e "$tmp/.config/$f" ] || { echo "bin:check failed: missing $f"; exit 1; }
done
zsh -c 'source "$1/.config/ttheme/ttheme.zsh"; (( ${#TTHEME_PALETTE} == 0 ))' zsh "$tmp" ||
  { echo "bin:check failed: a fresh init should install no palettes"; exit 1; }
grep -q '^theme = ' "$tmp/.config/ghostty/config" &&
  { echo "bin:check failed: a fresh init should not pin a terminal theme"; exit 1; }
env -i PATH="$PATH" HOME="$tmp" XDG_CONFIG_HOME="$tmp/.config" ZDOTDIR="$tmp" \
  node bin/ttheme.js add gojo > /dev/null
zsh -c 'source "$1/.config/ttheme/ttheme.zsh"; (( ${#TTHEME_PALETTE} == 1 )) && [[ -n ${TTHEME_PALETTE[gojo]} ]]' zsh "$tmp" ||
  { echo "bin:check failed: add did not reach the installed layer"; exit 1; }
grep -q '^theme = gojo$' "$tmp/.config/ghostty/config" ||
  { echo "bin:check failed: add did not point ghostty at the palette"; exit 1; }
env -i PATH="$PATH" HOME="$tmp" XDG_CONFIG_HOME="$tmp/.config" ZDOTDIR="$tmp" \
  node bin/ttheme.js remove gojo > /dev/null
zsh -c 'source "$1/.config/ttheme/ttheme.zsh"; (( ${#TTHEME_PALETTE} == 0 ))' zsh "$tmp" ||
  { echo "bin:check failed: remove did not reach the installed layer"; exit 1; }
run_init
for f in "$tmp/.config/ghostty/config" "$tmp/.zshrc"; do
  [ "$(grep -c '# ttheme begin' "$f")" = 1 ] ||
    { echo "bin:check failed: init is not idempotent in $f"; exit 1; }
done
echo "bin:check ok"
{% endraw %}
'''

[tasks.tui]
description = "compare every TUI screen against tests/screens/"
depends = ["build", "bin:build"]
run = "zsh tests/tui.zsh"

[tasks."tui:update"]
description = "rewrite tests/screens/ from what the TUIs draw now"
depends = ["build", "bin:build"]
run = "zsh tests/tui.zsh --update"

[tasks.demo]
description = "open one TUI scenario for real, in its fixture — `mise run demo browse-filter`"
depends = ["build", "bin:build"]
run = "zsh tests/tui.zsh demo"

[tasks."site:dev"]
description = "dev server for the showcase site"
dir = "{{config_root}}/site"
depends = ["build"]
run = "bun run dev"

[tasks."site:build"]
description = "static-export the showcase site into site/out"
dir = "{{config_root}}/site"
depends = ["build"]
run = "bun install && bun run build"

[tasks.publish]
description = "verify everything, rebuild dist and the bundle, publish to npm"
depends = ["ci"]
run = '''
set -e
bun build src/bin.ts --target=node --outfile=bin/ttheme.js
bun publish --access public
'''

[tasks.ci]
description = "everything the ci workflow runs"
depends = ["lint", "check", "test", "shell:check", "ghostty:check", "bin:check", "tui"]
