name: Palette
description: Offer your palette to the catalog — `ttheme submit <palette>` fills this in
title: "palette: "
labels: [palette]
body:
  - type: markdown
    attributes:
      value: |
        `ttheme submit <you>/<palette>` opens this form filled in. A bot checks the palette against the contrast gate and opens a pull request for it; this issue closes when that merges. The palette's name carries your GitHub handle, and only you change it later.

        Colors, a booru tag and post numbers only — no images, no links. Palettes are released under the project's MIT license.
  - type: textarea
    id: palette
    attributes:
      label: Palette
      render: toml
    validations:
      required: true
