name: Bug report
description: Something in ttheme does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ttheme version
      description: The output of `ttheme --version`.
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      description: For example Ghostty 1.3.1 on macOS 15, or Konsole on Fedora.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or screenshot
      description: Any error text, or `TTHEME_DEBUG=1 ttheme …` output. Optional.
      render: shell
