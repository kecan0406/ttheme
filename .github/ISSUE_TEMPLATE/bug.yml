name: Bug report
description: Something in ttheme does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead. If the terminal's version shows as unknown below, add it here.
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Output of ttheme info
      description: Run `ttheme info` in the terminal where it happened and paste what it prints. If ttheme is not set up or init failed, run `npx @kecan0406/ttheme@latest info` instead.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or screenshot
      description: Any error text, or `TTHEME_DEBUG=1 ttheme …` output. Optional.
      render: shell
