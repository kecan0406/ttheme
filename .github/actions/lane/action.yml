name: lane
description: What the change this run checks needs. checked for a release tag whose commit changes only package.json and CHANGELOG.md over a commit every ci job passed on a push to main, site when the change touches only what tests/lane leaves out (site/, docs/, Markdown and the instruction files), all otherwise — a pull request against its base, a push to a branch against its before, and another tag, a dispatch or a base it cannot fetch always all. Run it after actions/checkout.
outputs:
  lane:
    description: checked, site or all
    value: ${{ steps.lane.outputs.lane }}
runs:
  using: composite
  steps:
    - id: lane
      shell: bash
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.ref_type == 'branch' && github.event.before || '' }}
        GH_TOKEN: ${{ github.token }}
      run: |
        checked() {
          [ "$GITHUB_REF_TYPE" = tag ] && git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA" || return 1
          [ -z "$(git diff --no-renames --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- . ':!package.json' ':!CHANGELOG.md')" ] || return 1
          local run
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$(git rev-parse "$GITHUB_SHA^")&event=push&branch=main&status=success" --jq '.workflow_runs[].id'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "shells") | .steps[] | select(.name == "Run mise run ci:shells") | .conclusion' | grep -qx success && return 0
          done
          return 1
        }
        mapfile -t lane < tests/lane
        if checked; then
          echo lane=checked >> "$GITHUB_OUTPUT"
        elif [ -n "${BASE//0}" ] && git fetch -q --no-tags --depth=1 origin "$BASE" && git diff --quiet --no-renames "$BASE" "$GITHUB_SHA" -- "${lane[@]}"; then
          echo lane=site >> "$GITHUB_OUTPUT"
        else
          echo lane=all >> "$GITHUB_OUTPUT"
        fi
