name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: bun install --frozen-lockfile
      - run: mise run ci
