name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Bump version to ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: install zsh in the background
        run: (set +e; sudo apt-get install -y zsh tmux sqlite3 || { sudo apt-get update && sudo apt-get install -y zsh tmux sqlite3; }; echo $? > "$RUNNER_TEMP/apt.rc") > "$RUNNER_TEMP/apt.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - name: zsh installed
        run: until [ -s "$RUNNER_TEMP/apt.rc" ]; do sleep 0.2; done; cat "$RUNNER_TEMP/apt.log"; exit "$(cat "$RUNNER_TEMP/apt.rc")"
      - run: mise run ci:checks

  parity:
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Bump version to ')
    name: parity (${{ matrix.terminals }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - terminals: warp
            slots: 6
          - terminals: windows-terminal,ghostty,iterm2
            slots: 4
          - terminals: kitty,alacritty,wezterm,contour
            slots: 4
          - terminals: konsole,terminal-app,rio
            slots: 4
    steps:
      - name: install zsh in the background
        run: (set +e; sudo apt-get install -y zsh tmux sqlite3 || { sudo apt-get update && sudo apt-get install -y zsh tmux sqlite3; }; echo $? > "$RUNNER_TEMP/apt.rc") > "$RUNNER_TEMP/apt.log" 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - name: zsh installed
        run: until [ -s "$RUNNER_TEMP/apt.rc" ]; do sleep 0.2; done; cat "$RUNNER_TEMP/apt.log"; exit "$(cat "$RUNNER_TEMP/apt.rc")"
      - run: mise run parity --only ${{ matrix.terminals }} --slots ${{ matrix.slots }}

  ci:
    if: always() && github.ref_type != 'tag' && (github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'Bump version to '))
    needs: [checks, parity]
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
