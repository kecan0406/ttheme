name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  checks:
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lane
        uses: ./.github/actions/lane
      - if: steps.lane.outputs.lane != 'checked'
        uses: ./.github/actions/setup
        with:
          save: true
      - if: steps.lane.outputs.lane != 'checked'
        env:
          TASK: ${{ steps.lane.outputs.lane == 'site' && 'ci:site' || 'ci:checks' }}
        run: mise run "$TASK"

  shells:
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lane
        uses: ./.github/actions/lane
      - if: steps.lane.outputs.lane == 'all'
        uses: ./.github/actions/setup
      - if: steps.lane.outputs.lane == 'all'
        run: mise run ci:shells

  parity:
    if: github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'release:')
    name: parity (${{ matrix.terminals }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - terminals: warp
            slots: 6
          - terminals: windows-terminal,ghostty,iterm2
            slots: 4
          - terminals: kitty,alacritty,wezterm,contour
            slots: 4
          - terminals: konsole,terminal-app,rio
            slots: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lane
        uses: ./.github/actions/lane
      - if: steps.lane.outputs.lane == 'all'
        uses: ./.github/actions/setup
      - if: steps.lane.outputs.lane == 'all'
        run: mise run parity --only ${{ matrix.terminals }} --slots ${{ matrix.slots }}

  ci:
    if: always() && github.ref_type != 'tag' && (github.ref != 'refs/heads/main' || !startsWith(github.event.head_commit.message, 'release:'))
    needs: [checks, shells, parity]
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
