name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: false
      - run: sudo apt-get install -y zsh || { sudo apt-get update && sudo apt-get install -y zsh; }
      - run: bun install --frozen-lockfile

      - name: the tag names the package version
        if: github.ref_type == 'tag'
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - run: mise run bin:check

      - name: package
        run: |
          mkdir -p release npm
          npm pack --pack-destination npm
          for dir in dist/*/; do
            term=$(basename "$dir")
            [ "$term" = shell ] || tar -czf "release/ttheme-$term.tar.gz" -C dist "$term"
          done
          tar -czf release/ttheme-all.tar.gz dist shell README.md

      - name: notes
        if: github.ref_type == 'tag'
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v}" '/^## / { on = ($0 == head); next } on' CHANGELOG.md | sed '/./,$!d' > notes.md
          grep -q . notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            npm/
            notes.md
          if-no-files-found: error

  publish:
    needs: [ci, pack]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm publish ./npm/*.tgz

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md --verify-tag
