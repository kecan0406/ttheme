name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  pack:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
      - run: sudo apt-get install -y zsh || { sudo apt-get update && sudo apt-get install -y zsh; }
      - run: bun install --frozen-lockfile

      - name: the tag names the package version
        if: github.ref_type == 'tag'
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - run: mise run bin:check

      - name: package
        run: |
          mkdir -p release npm
          npm pack --pack-destination npm
          # Bridge release: the same build once more under the old name, so an install that
          # still follows @kecan0406/ttheme moves to ttheme by its own update. Remove after it.
          mkdir bridge
          tar -xzf npm/ttheme-*.tgz -C bridge
          jq '.name = "@kecan0406/ttheme"' bridge/package/package.json > bridge/package.json.new
          mv bridge/package.json.new bridge/package/package.json
          npm pack ./bridge/package --pack-destination npm
          for dir in dist/*/; do
            term=$(basename "$dir")
            [ "$term" = shell ] || tar -czf "release/ttheme-$term.tar.gz" -C dist "$term"
          done
          tar -czf release/ttheme-all.tar.gz dist shell README.md

      - name: notes
        if: github.ref_type == 'tag'
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v}" '/^## / { on = ($0 == head); next } on' CHANGELOG.md | sed '/./,$!d' > notes.md
          grep -q . notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            npm/
            notes.md
          if-no-files-found: error

  publish:
    needs: [ci, pack]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm publish
        run: |
          version=${GITHUB_REF_NAME#v}
          for tgz in ./npm/*.tgz; do
            name=$(tar -xOzf "$tgz" package/package.json | jq -r .name)
            published() { [ "$(npm view "$name@$version" version --prefer-online 2>/dev/null)" = "$version" ]; }
            ok=
            for pause in 20 40 60; do
              published && { ok=1; break; }
              npm publish "$tgz" && { ok=1; break; }
              sleep "$pause"
            done
            [ -n "$ok" ] || published
          done

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md --verify-tag

      - name: close the weekly release issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --label release --state open --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Released in $GITHUB_REF_NAME."
          done
