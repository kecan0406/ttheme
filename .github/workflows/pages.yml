name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '5 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: mise run pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: compare
        if: github.event_name != 'workflow_dispatch'
        run: |
          same() { curl -fsS "https://index.ttheme.dev/$1" | cmp -s - "pages/$1"; }
          changed=false
          for file in $(cd pages && find . -type f); do
            if ! same "${file#./}"; then
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - if: steps.compare.outputs.changed != 'false'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.compare.outputs.changed != 'false'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    needs: build
    if: needs.build.outputs.changed != 'false'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  site:
    needs: build
    if: github.event_name == 'schedule' && github.event.schedule == '5 4 * * *'
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - run: |
          mkdir built
          curl -fsS https://index.ttheme.dev/marketplaces.json -o built/marketplaces.json
          curl -fsS https://index.ttheme.dev/stars.json -o built/stars.json
          curl -fsS https://names.ttheme.dev/authority.json -o built/authority.json
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rebuilt
          key: site-index-${{ github.run_id }}
          restore-keys: site-index-
      - id: compare
        run: |
          due=false
          if [ "$(date -u +%u)" = 1 ] || ! diff -r built rebuilt > /dev/null 2>&1; then
            due=true
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - if: steps.compare.outputs.due == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "${VERCEL_DEPLOY_HOOK:?VERCEL_DEPLOY_HOOK is not set}" > /dev/null
          rm -rf rebuilt
          mv built rebuilt
      - if: steps.compare.outputs.due == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rebuilt
          key: site-index-${{ github.run_id }}
