name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      index: ${{ steps.compare.outputs.index }}
      stars: ${{ steps.compare.outputs.stars }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: mise run pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: compare
        if: github.event_name != 'workflow_dispatch'
        run: |
          same() { curl -fsS "https://index.ttheme.dev/$1" | cmp -s - "pages/$1"; }
          index=changed
          if same marketplaces.json; then
            index=same
          fi
          stars=same
          if [ -f pages/stars.json ] && ! same stars.json; then
            stars=changed
          fi
          changed=false
          for file in $(cd pages && find . -type f); do
            if ! same "${file#./}"; then
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "stars=$stars" >> "$GITHUB_OUTPUT"

      - if: steps.compare.outputs.changed != 'false'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.compare.outputs.changed != 'false'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    needs: build
    if: needs.build.outputs.changed != 'false'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  site:
    needs: build
    if: github.event_name == 'schedule' && (needs.build.outputs.index == 'changed' || needs.build.outputs.stars == 'changed')
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "${VERCEL_DEPLOY_HOOK:?VERCEL_DEPLOY_HOOK is not set}" > /dev/null
