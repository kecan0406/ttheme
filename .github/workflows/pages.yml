name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: mise run site:build
        env:
          PAGES_BASE_PATH: /ttheme
          GITHUB_TOKEN: ${{ github.token }}

      - name: publish the catalog beside the site
        run: cp dist/manifest.json site/out/manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@v4
