version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      site:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: elysia
        versions: [">=2.0.0-exp.0 <2.0.0"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
